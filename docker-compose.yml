services:
  mongodb:
    image: mongo:8.0
    container_name: medipulse-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=medipulse_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medipulse-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/
      - DATABASE_NAME=medipulse_db
      - FLASK_SECRET_KEY=medipulse_production_secret_key_2026
      - HOST=0.0.0.0
      - PORT=5000
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
